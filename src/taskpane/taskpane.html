<!doctype html>
<html lang="en" data-framework="javascript">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FeedEcho</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- webpackIgnore: true -->
    <link rel="stylesheet" href="taskpane.css" />
</head>

<body>
    <div class="app">
        <header id="app-header" class="app-header" hidden>
            <img class="header-logo" src="../../assets/feedecho-logo.png" alt="FeedEcho logo" />
            <h1 class="app-title">FeedEcho</h1>
        </header>

        <section id="login-section" class="auth-screen" aria-label="Sign in">
            <div class="auth-brand">
                <div class="auth-logo-frame">
                    <img class="auth-logo" src="../../assets/feedecho-logo.png" alt="FeedEcho logo" />
                </div>
                <h1 class="auth-brand-title">FeedEcho</h1>
                <p class="auth-brand-tagline">The loop of learning</p>
            </div>

            <div class="auth-body">
                <form id="login-form" class="auth-form" action="#" method="post">
                    <label class="field" for="email">
                        <span class="field-label">Email</span>
                        <input id="email" name="email" type="email" placeholder="you@gmail.com" autocomplete="username" />
                    </label>
                    <label class="field" for="password">
                        <span class="field-label">Password</span>
                        <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" />
                    </label>
                    <div class="auth-forgot-row">
                        <button id="forgot-password-btn" class="auth-link" type="button">Forgot password?</button>
                    </div>
                    <button id="login-btn" class="btn btn-primary" type="submit">Login</button>
                    <p id="login-error" class="login-error" hidden role="alert"></p>
                    <div class="auth-divider" role="separator"><span>or</span></div>
                    <button id="google-signin-btn" class="btn btn-google" type="button">
                        <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.2 0-9.7-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.8-6.6 7.5l6.3 5.3C38.4 37.3 44 31.5 44 24c0-1.3-.1-2.3-.4-3.5z"/>
                        </svg>
                        Continue with Google
                    </button>
                    <p class="auth-switch">Don't have an account? <a class="auth-signup-link" href="https://feedecho-web.onrender.com/host/signup" target="_blank" rel="noopener noreferrer">Sign up</a></p>
                </form>

                <div class="auth-footer">
                    <p>Powered by FeedEcho</p>
                </div>
            </div>
        </section>

        <main id="app-main" class="app-main" hidden>
            <section id="home-section" class="home-section" hidden aria-label="Home">
                <header class="home-header">
                    <div class="home-header-user">
                        <span id="teacher-initials" class="home-avatar">T</span>
                        <span id="teacher-name" class="home-header-name">Teacher</span>
                    </div>
                    <button id="logout-btn" class="home-logout-icon" type="button" aria-label="Log out" title="Log out">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </header>

                <div class="home-body">
                    <section id="session-section" class="home-session-card" hidden aria-label="Session">
                        <p id="session-status" class="home-session-label">Checking for an active session…</p>
                        <div id="session-create" hidden>
                            <button id="create-session-btn" class="btn btn-primary" type="button">Create session</button>
                        </div>
                        <div id="session-code-wrap" hidden>
                            <div class="session-code-row">
                                <span id="session-code" class="session-code"></span>
                                <button id="copy-session-code-btn" class="btn btn-copy" type="button" title="Copy session code" aria-label="Copy session code">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                    Copy
                                </button>
                            </div>
                        </div>
                        <p id="session-error" class="login-error" hidden role="alert"></p>
                    </section>

                    <div id="home-cards" class="home-activity-list">
                        <p class="home-activity-label">Launch an activity</p>
                        <button id="home-quiz-card" class="home-activity-row" type="button">
                            <span class="home-activity-badge home-activity-badge-quiz" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                                </svg>
                            </span>
                            <span class="home-activity-text">
                                <span class="home-activity-title">Launch quiz</span>
                                <span class="home-activity-subtitle">Create and launch instantly</span>
                            </span>
                        </button>
                        <button id="home-exit-ticket-card" class="home-activity-row" type="button">
                            <span class="home-activity-badge home-activity-badge-exit" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 11l3 3L22 4"></path>
                                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                                </svg>
                            </span>
                            <span class="home-activity-text">
                                <span class="home-activity-title">Exit ticket</span>
                                <span class="home-activity-subtitle">Gather quick feedback</span>
                            </span>
                        </button>
                    </div>
                </div>
            </section>

            <section id="launch-actions" class="launch-actions" hidden aria-label="Launch activities">
                <button id="launch-mcq-btn" class="btn btn-launch" type="button">Launch MCQ Quiz</button>
                <button id="launch-exit-ticket-btn" class="btn btn-launch" type="button">Launch Exit Ticket</button>
                <p id="launch-success" class="launch-success" hidden role="status"></p>
                <p id="launch-error" class="login-error" hidden role="alert"></p>
            </section>

            <section id="quiz-builder" class="card quiz-builder" hidden aria-label="Create quiz">
                <h2 class="section-title">Create quiz</h2>
                <label class="field" for="quiz-builder-title">
                    <span class="field-label">Quiz title</span>
                    <input id="quiz-builder-title" type="text" placeholder="Live quiz" />
                </label>
                <div id="quiz-builder-questions" class="quiz-builder-questions"></div>
                <button id="quiz-builder-add-q" class="btn btn-primary" type="button">Add question</button>
                <p id="quiz-builder-slide-status" class="slide-sync-status" hidden role="status"></p>
                <p id="quiz-builder-error" class="login-error" hidden role="alert"></p>
                <div class="picker-actions quiz-builder-actions">
                    <button id="quiz-builder-launch" class="btn btn-primary" type="button">Launch</button>
                    <button id="quiz-builder-cancel" class="btn btn-outline" type="button">Cancel</button>
                </div>
            </section>

            <section id="quiz-picker" class="card" hidden aria-label="Select activity">
                <h2 id="quiz-picker-title" class="section-title">Select an MCQ quiz</h2>
                <p id="quiz-picker-status" class="session-status">Loading quizzes…</p>
                <div id="quiz-list" class="quiz-list" role="listbox" aria-label="Ready activities"></div>
                <div class="picker-actions">
                    <button id="confirm-launch-quiz-btn" class="btn btn-primary" type="button" disabled>Launch selected quiz</button>
                    <button id="cancel-quiz-picker-btn" class="btn btn-outline" type="button">Cancel</button>
                </div>
                <p id="quiz-picker-error" class="login-error" hidden role="alert"></p>
            </section>
        </main>
    </div>
</body>

</html>
